<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLC</title>
    <link rel="stylesheet" href="vlc.css">

</head>
<body>
    <div class="titlebar">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/VLC_icon.png?_=20150202150351" alt="VLC player">
        <h2>VLC media player</h2>
    </div>
    <div class="menubar">

        <div class="menu">
        <div id="menubtn" class="openbtn">Open</div>
        <input class="userFile" type="file">
        </div>
        
        <div class="menu">
            <div id="menubtn" class="playbtn">Playback</div>
        <ul class="menu-item">
            <li id="speedUp">Speed Up</li>
            <li id="speedDown">Speed Down</li>
        </ul>
        </div>
        
         <div class="menu">
            <div id="menubtn" class="volBtn">Audio</div>
        <ul class="menu-item">
            <li id="volUp">Volume Up</li>
            <li id="volDown">Volume Down</li>
        </ul>
        </div>

    </div>
    <div class="vidplayarea">

    </div>
    <div class="progressbar"></div>
    <div class="controls">
        <button  id="crtbtn" class="startbtn">&#9654;</button>
        <button id="crtbtn"  class="stopbtn">&#9209;</button>
        <button id="crtbtn"  class="pausebtn">&#9208;</button>
        <button id="crtbtn" class="backtrack">&#x23EE;</button>
        <button id="crtbtn" class="fasttrack">&#x23ED;</button>
    </div>
    
    <script src="vlc.js"></script>
</body>
</html>
